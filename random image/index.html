<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>API Image Carousel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>API Fetched Image Carousel</h1>
    <div id="carousel">
      <img id="carousel-img" src="" alt="Image" />
      <div>
        <button onclick="prevImg()">Prev</button>
        <button onclick="nextImg()">Next</button>
        <button onclick="fetchImages()">Refresh Images</button>
      </div>
    </div>
    <div id="status"></div>
  </div>
  <script src="script.js"></script>
</body>
</html>
